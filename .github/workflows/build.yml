name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch, Tag oder Commit der App (lotterfriends/antatime)
        default: main
      deploy:
        description: Nach dem Build per FTP auf den Server hochladen (nur Admins, nur master)
        type: boolean
        default: false

permissions:
  contents: read

env:
  NODE_VERSION: 26
  # Gleiche Version wie im App-Repo und im Dockerfile.
  FLUTTER_VERSION: 3.47.9
  APP_REPOSITORY: lotterfriends/antatime

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: antatime
          MYSQL_USER: antatime
          MYSQL_PASSWORD: antatime
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uantatime -pantatime"
          --health-interval 5s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests im Arbeitsspeicher und zusätzlich gegen MySQL.
      - run: npm test
        env:
          TEST_DATABASE_URL: mysql://antatime:antatime@127.0.0.1:3306/antatime

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: antatime-server

      # Das App-Repo ist privat: GITHUB_TOKEN reicht dafür nicht. Secret
      # APP_REPO_TOKEN = Fine-grained Personal Access Token mit
      # „Contents: Read-only“ für lotterfriends/antatime.
      - name: Zugriff auf das App-Repo prüfen
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          if [ -z "$APP_REPO_TOKEN" ]; then
            echo "::error::Secret APP_REPO_TOKEN fehlt (Lesezugriff auf $APP_REPOSITORY), siehe Kommentar im Workflow."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ inputs.app_ref || 'main' }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: antatime-app

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Web-App bauen
        working-directory: antatime-app
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get
          flutter build web --release

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: antatime-server/package-lock.json
      - name: Server bündeln
        working-directory: antatime-server
        run: |
          # Ohne Web-Build würde build.mjs nur warnen und ohne App bündeln.
          test -f ../antatime-app/build/web/index.html
          npm ci
          npm run build
      - name: Bundle startet
        working-directory: antatime-server
        run: |
          STORE=memory PORT=8080 node dist/antatime-server.cjs &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'antatime-sync-url'
          kill $pid

      - uses: actions/upload-artifact@v4
        with:
          name: antatime-server
          path: antatime-server/dist/antatime-server.cjs
          if-no-files-found: error

  # Manuell: „Run workflow“ auf master mit Haken „deploy“. Zugangsdaten im
  # Environment „production“ (Settings → Environments):
  #   Variablen: FTP_HOST, FTP_USER, FTP_REMOTE_DIR (Anwendungsverzeichnis in
  #              Plesk), optional FTP_PORT, FTP_VERIFY_CERT=false (selbst
  #              signiertes Zertifikat), FTP_INSECURE=true (FTP ohne TLS)
  #   Secret:    FTP_PASSWORD
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Nur Admins des Repos
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$perm" != "admin" ]; then
            echo "::error::$ACTOR hat die Berechtigung „$perm“, Deploy ist nur für Admins erlaubt."
            exit 1
          fi
          echo "Deploy durch $ACTOR (admin)"

      - uses: actions/download-artifact@v4
        with:
          name: antatime-server
          path: dist

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Per FTP hochladen und App neu starten
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_USER: ${{ vars.FTP_USER }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_VERIFY_CERT: ${{ vars.FTP_VERIFY_CERT }}
          FTP_INSECURE: ${{ vars.FTP_INSECURE }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in FTP_HOST FTP_USER FTP_REMOTE_DIR LFTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v fehlt (Environment „production“, Passwort als Secret FTP_PASSWORD)."
              exit 1
            fi
          done
          if [ "$FTP_INSECURE" = "true" ]; then
            echo "::warning::FTP ohne TLS, das Passwort geht im Klartext über die Leitung."
            tls="set ftp:ssl-allow false"
          else
            tls="set ftp:ssl-force true; set ftp:ssl-protect-data true"
          fi
          verify=$([ "$FTP_VERIFY_CERT" = "false" ] && echo false || echo true)
          : > restart.txt
          # Erst unter temporärem Namen hochladen, dann umbenennen: Passenger
          # sieht nie eine halbe Datei. tmp/restart.txt startet die App neu.
          lftp -p "${FTP_PORT:-21}" -u "$FTP_USER" --env-password "$FTP_HOST" <<LFTP
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 2
          set ssl:verify-certificate $verify
          $tls
          cd "$FTP_REMOTE_DIR"
          put dist/antatime-server.cjs -o antatime-server.cjs.uploading
          mv antatime-server.cjs.uploading antatime-server.cjs
          mkdir -f -p tmp
          put restart.txt -o tmp/restart.txt
          cls -l antatime-server.cjs
          bye
          LFTP
